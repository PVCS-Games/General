<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family 家庭卡片</title><style>
*{box-sizing:border-box}body{margin:0;background:#fffaf3;color:#302b28;font-family:Arial,"Microsoft YaHei","Noto Sans SC",sans-serif}
header{text-align:center;padding:18px 12px;background:#fff;border-bottom:3px solid #ead8b6}
h1{margin:0;font-size:30px}.py{color:#52718a;font-size:.58em;font-weight:500}.wrap{max-width:1050px;margin:auto;padding:16px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}.tabs button,button{min-height:44px;border:1px solid #cabfae;background:#fff;border-radius:12px;padding:9px 14px;font-size:16px;cursor:pointer}
.tabs button.active{background:#397bb6;color:#fff}.panel{display:none}.panel.active{display:block}
.card{background:#fff;border:2px solid #e8dcc5;border-radius:16px;padding:14px}.grid{display:grid;gap:12px}.g7{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}.g5{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.word{text-align:center;font-size:31px;font-weight:800}.pinyin{text-align:center;color:#52718a}.eng{text-align:center;color:#666}.emoji{text-align:center;font-size:56px;line-height:1.3}
.trace{font-size:35px;color:#aaa;letter-spacing:5px;text-align:center;border-bottom:2px solid #aaa;margin:8px 0}.write{width:100%;font-size:25px;text-align:center;border:0;border-bottom:2px solid #999;padding:8px}
.q{font-size:23px;margin:12px 0}.answer{font-size:21px;width:100%;padding:10px;border:1px solid #bbb;border-radius:9px}.feedback{min-height:28px;font-weight:700;margin-top:7px}.good{color:#267447}.bad{color:#a03b35}
.dialogue{display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:start;margin:10px 0;font-size:20px}.num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#f3c8ce;font-weight:800}
.practice{font-size:22px;line-height:2.2;border-bottom:1px dashed #d8cdbb}.blank{font-size:20px;border:0;border-bottom:2px solid #777;min-width:110px;max-width:180px;padding:4px;background:transparent}
.bigbox{min-height:145px;border:2px dashed #aaa;border-radius:12px;padding:12px;background:#fff}.small{font-size:14px;color:#6c6863}.center{text-align:center}
@media(max-width:520px){h1{font-size:25px}.word{font-size:26px}.q,.practice{font-size:19px}}
</style></head>
<body><header><h1>Family 家庭卡片</h1></header><div class="wrap"><nav class="tabs"><button data-tab="cards" class="active">Family Cards</button></nav><section class="panel active" id="cards"><div class="grid g4"><div class="card"><div class="word" style="font-size:25px">family</div><div class="emoji">👨‍👩‍👧‍👦</div><div class="eng">家人 / 家庭</div><div class="center"><button data-speak="家人">🔊 中文</button></div></div><div class="card"><div class="word" style="font-size:25px">father</div><div class="emoji">👨</div><div class="eng">爸爸</div><div class="center"><button data-speak="爸爸">🔊 中文</button></div></div><div class="card"><div class="word" style="font-size:25px">mother</div><div class="emoji">👩</div><div class="eng">妈妈</div><div class="center"><button data-speak="妈妈">🔊 中文</button></div></div><div class="card"><div class="word" style="font-size:25px">girl</div><div class="emoji">👧</div><div class="eng">女孩</div><div class="center"><button data-speak="女孩">🔊 中文</button></div></div><div class="card"><div class="word" style="font-size:25px">brother</div><div class="emoji">👦</div><div class="eng">哥哥 / 弟弟</div><div class="center"><button data-speak="哥哥">🔊 中文</button></div></div><div class="card"><div class="word" style="font-size:25px">grandma</div><div class="emoji">👵</div><div class="eng">奶奶 / 外婆</div><div class="center"><button data-speak="奶奶">🔊 中文</button></div></div><div class="card"><div class="word" style="font-size:25px">boy</div><div class="emoji">⚽</div><div class="eng">男孩</div><div class="center"><button data-speak="男孩">🔊 中文</button></div></div><div class="card"><div class="word" style="font-size:25px">student</div><div class="emoji">🎒</div><div class="eng">学生</div><div class="center"><button data-speak="学生">🔊 中文</button></div></div><div class="card"><div class="word" style="font-size:25px">sister</div><div class="emoji">👧</div><div class="eng">姐姐 / 妹妹</div><div class="center"><button data-speak="姐姐">🔊 中文</button></div></div><div class="card"><div class="word" style="font-size:25px">grandpa</div><div class="emoji">👴</div><div class="eng">爷爷 / 外公</div><div class="center"><button data-speak="爷爷">🔊 中文</button></div></div><div class="card"><div class="word" style="font-size:25px">friend</div><div class="emoji">🧑‍🤝‍🧑</div><div class="eng">朋友</div><div class="center"><button data-speak="朋友">🔊 中文</button></div></div><div class="card"><div class="word" style="font-size:25px">teacher</div><div class="emoji">👩‍🏫</div><div class="eng">老师</div><div class="center"><button data-speak="老师">🔊 中文</button></div></div></div></section></div>
<script>
document.querySelector('.tabs').addEventListener('click',e=>{if(!e.target.dataset.tab)return;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b===e.target));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===e.target.dataset.tab));});
function speak(t){if(!('speechSynthesis' in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.78;speechSynthesis.speak(u)}
document.addEventListener('click',e=>{if(e.target.dataset.speak)speak(e.target.dataset.speak);if(e.target.dataset.check)check(e.target)});
function check(btn){let box=btn.closest('.checkblock'), input=box.querySelector('input,select'), fb=box.querySelector('.feedback'), ans=(box.dataset.answer||'').trim();let ok=(input.value||'').trim()===ans;fb.textContent=ok?'✓ 对了！':'再试一次';fb.className='feedback '+(ok?'good':'bad')}
</script></body></html>
