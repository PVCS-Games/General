const passage=document.querySelector('#passage');
const fullText=ESSAY.paragraphs.map(p=>p.map(u=>u.c).join('')).join('\n');
document.querySelector('#essay-title').textContent=ESSAY.title;
const readingSentences=[];
for(const [index, paragraph] of ESSAY.paragraphs.entries()){
 const p=document.createElement('p');p.className='paragraph';
 let sentence=document.createElement('span');sentence.className='reading-sentence';
 let sentenceText='';
 function finishSentence(){
  if(!sentence.childNodes.length)return;
  sentence.dataset.text=sentenceText;
  readingSentences.push({node:sentence,text:sentenceText});
  p.append(sentence);
  sentence=document.createElement('span');sentence.className='reading-sentence';sentenceText='';
 }
 for(const u of paragraph){
  const highlighted=!!(u.v||u.g);
  const el=document.createElement(highlighted?'button':'span');
  el.classList.add('unit');
  if(highlighted){
   el.type='button';el.className='unit '+(u.v?'vocab':'grammar');
   el.setAttribute('aria-label',u.c+': '+(u.v||u.g));
   el.addEventListener('mouseenter',()=>showHover(el,u));
   el.addEventListener('mouseleave',hideHover);
   el.addEventListener('focus',()=>showHover(el,u));
   el.addEventListener('blur',hideHover);
   el.addEventListener('click',event=>{event.stopPropagation();if(activeHover===el&&!hoverNote.hidden){hideHover();el.blur();}else showHover(el,u);});
  }
  if(u.p){const ruby=document.createElement('ruby');ruby.append(document.createTextNode(u.c));const rt=document.createElement('rt');rt.textContent=u.p;ruby.append(rt);el.append(ruby);} else el.textContent=u.c;
  sentence.append(el);sentenceText+=u.c;
  // Group complete sentences; keep natural punctuation and word formatting.
  if(/[。！？!?][”’」』）)]?$/.test(u.c))finishSentence();
 }
 finishSentence();
 passage.append(p);
 const translation=document.createElement('p');translation.className='english-translation';translation.lang='en';translation.hidden=true;translation.textContent=ENGLISH_PARAGRAPHS[index]||'';passage.append(translation);
}
const hoverNote=document.querySelector('#hover-note');
let activeHover=null;
function hideHover(){if(activeHover)activeHover.classList.remove("is-active");hoverNote.hidden=true;activeHover=null;}
function showHover(el,u){
 const type=u.v?'vocab':'grammar';
 if(passage.classList.contains('hide-'+type)){hideHover();return;}
 hoverNote.className='hover-note '+type+'-note';
 document.querySelector('#hover-word').textContent=u.c;
 document.querySelector('#hover-pinyin').textContent=u.p||'';
 document.querySelector('#hover-definition').textContent=u.v||u.g;
 if(activeHover&&activeHover!==el)activeHover.classList.remove("is-active");
 hoverNote.hidden=false;activeHover=el;el.classList.add("is-active");
 positionHover();
}
function positionHover(){
 if(!activeHover||hoverNote.hidden)return;
 const target=activeHover.getBoundingClientRect();
 const width=hoverNote.offsetWidth,height=hoverNote.offsetHeight,gap=9,pad=12;
 let left=Math.max(pad,Math.min(target.left+(target.width-width)/2,innerWidth-width-pad));
 let top=target.bottom+gap;
 if(top+height>innerHeight-pad && target.top-height-gap>=pad)top=target.top-height-gap;
 else top=Math.min(top,Math.max(pad,innerHeight-height-pad));
 hoverNote.style.left=left+'px';hoverNote.style.top=top+'px';
}
window.addEventListener('scroll',positionHover,{passive:true});
window.addEventListener('resize',positionHover);
document.addEventListener('pointerdown',event=>{if(!event.target.closest('.unit.vocab,.unit.grammar'))hideHover();});
document.addEventListener('keydown',event=>{if(event.key==='Escape')hideHover();});
const englishToggle=document.querySelector('#english-toggle');
englishToggle.addEventListener('click',()=>{const visible=englishToggle.classList.toggle('on');englishToggle.setAttribute('aria-pressed',String(visible));for(const tr of passage.querySelectorAll('.english-translation'))tr.hidden=!visible;});
for(const btn of document.querySelectorAll('[data-toggle]')){btn.addEventListener('click',()=>{
 let on=btn.classList.toggle('on');btn.setAttribute('aria-pressed',String(on));
 passage.classList.toggle('hide-'+btn.dataset.toggle,!on);
 if(!on && (btn.dataset.toggle==='vocab'||btn.dataset.toggle==='grammar')){
  if(activeHover && activeHover.classList.contains(btn.dataset.toggle))hideHover();
 }
});}
const audio=ESSAY.audioUrl?new Audio(ESSAY.audioUrl):null;
let speaking=false,session=0,activeRead=null;
const play=document.querySelector('#play'),slow=document.querySelector('#slow');
function markReading(node){
 if(activeRead)activeRead.classList.remove('sentence-active');
 activeRead=node||null;
 if(node){node.classList.add('sentence-active');
  const rect=node.getBoundingClientRect();
  if(rect.top<80||rect.bottom>innerHeight-45)node.scrollIntoView({block:'center',behavior:'smooth'});
 }
}
function stopped(){speaking=false;markReading(null);play.textContent='▶ Play';play.classList.remove('on');play.setAttribute('aria-pressed','false');}
function stopAudio(){++session;if(audio){audio.pause();audio.currentTime=0;}if('speechSynthesis' in window)window.speechSynthesis.cancel();stopped();}
function speakSentence(id,index=0){
 if(id!==session||!speaking)return;
 if(index>=readingSentences.length){stopped();return;}
 const {node,text}=readingSentences[index];
 markReading(node);
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang='zh-CN';
 utterance.rate=slow.classList.contains('on')?.72:1;
 utterance.onend=()=>{if(id===session)speakSentence(id,index+1);};
 utterance.onerror=event=>{
  if(id!==session)return;
  if(event.error==='canceled'||event.error==='interrupted')return;
  speakSentence(id,index+1);
 };
 window.speechSynthesis.speak(utterance);
}
play.addEventListener('click',()=>{
 if(speaking){stopAudio();return;}
 stopAudio();
 if(!('speechSynthesis' in window)){
  if(audio){speaking=true;play.textContent='■ Stop';play.classList.add('on');audio.playbackRate=slow.classList.contains('on')?.75:1;audio.onended=stopped;audio.play().catch(()=>{stopped();alert('Unable to load the recording.');});}
  else alert('This browser does not support speech playback.');
  return;
 }
 speaking=true;play.textContent='■ Stop';play.classList.add('on');play.setAttribute('aria-pressed','true');
 speakSentence(session);
});
slow.addEventListener('click',()=>{
 const on=slow.classList.toggle('on');slow.setAttribute('aria-pressed',String(on));
 if(audio)audio.playbackRate=on?.75:1;
 // The next sentence uses the newly selected reading speed.
});
window.addEventListener('pagehide',()=>{if(speaking)stopAudio();});
